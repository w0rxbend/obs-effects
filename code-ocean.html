<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Code Ocean — OBS Browser Source</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #frags {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .frag {
        position: absolute;
        font-family: "Courier New", Courier, monospace;
        letter-spacing: 0.06em;
        color: rgba(0, 220, 200, 0.55);
        text-shadow:
          0 0 8px rgba(0, 240, 230, 0.75),
          0 0 22px rgba(0, 180, 255, 0.35);
        white-space: nowrap;
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="frags"></div>
    <script>
      "use strict";

      // ─── WebGL2 setup ──────────────────────────────────────────────────────────────
      const canvas = document.getElementById("c");
      const gl = canvas.getContext("webgl2", {
        antialias: false,
        alpha: false,
        premultipliedAlpha: false,
        preserveDrawingBuffer: false,
        powerPreference: "high-performance",
      });
      if (!gl) {
        document.body.innerHTML =
          '<p style="color:#0ff;font:1em Courier;padding:2em">WebGL2 required</p>';
        throw new Error("no webgl2");
      }

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        gl.viewport(0, 0, canvas.width, canvas.height);
      }
      window.addEventListener("resize", resize);
      resize();

      // ─── Shaders ───────────────────────────────────────────────────────────────────
      const VS = `#version 300 es
in vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }`;

      const FS = `#version 300 es
precision highp float;
out vec4 fragColor;

uniform float uT;
uniform vec2  uR;

// ── Hash / noise ────────────────────────────────────────────────────────────
float h11(float p){
  p = fract(p * 0.1031);
  p *= p + 33.33;
  return fract(p * (p + p));
}
float h21(vec2 p){
  vec3 q = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
  q += dot(q, q.yzx + 33.33);
  return fract((q.x + q.y) * q.z);
}
float fbm(vec2 p){
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 4; i++){
    vec2 i2 = floor(p), f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    v += a * mix(
      mix(h21(i2),          h21(i2 + vec2(1,0)), f.x),
      mix(h21(i2 + vec2(0,1)), h21(i2 + vec2(1,1)), f.x), f.y);
    p *= 2.1; a *= 0.5;
  }
  return v;
}

// ── 5×7 pixel font for hex digits 0-F ──────────────────────────────────────
float charPx(int c, int row, int col){
  int[112] F = int[112](
    14,17,17,17,17,17,14,  // 0
     4,12, 4, 4, 4, 4,14,  // 1
    14,17, 1, 2, 4, 8,31,  // 2
    14,17, 1, 6, 1,17,14,  // 3
     1, 3, 5, 9,31, 1, 1,  // 4
    31,16,30, 1, 1,17,14,  // 5
    14,16,16,30,17,17,14,  // 6
    31, 1, 2, 4, 8, 8, 8,  // 7
    14,17,17,14,17,17,14,  // 8
    14,17,17,15, 1, 2,12,  // 9
    14,17,17,31,17,17,17,  // A
    30,17,17,30,17,17,30,  // B
    14,17,16,16,16,17,14,  // C
    28,18,17,17,17,18,28,  // D
    31,16,16,30,16,16,31,  // E
    31,16,16,30,16,16,16   // F
  );
  return float((F[c * 7 + row] >> (4 - col)) & 1);
}

void main(){
  vec2 uv  = gl_FragCoord.xy / uR;
  float t  = uT * 0.28;

  // uv.y: 0 = bottom of screen (deep), 1 = top of screen (surface)
  float depthF = 1.0 - uv.y;   // 0 = surface, 1 = deep

  // ── Background — depth gradient ─────────────────────────────────────────
  vec3 col = mix(
    vec3(0.010, 0.026, 0.095),   // near surface: brighter navy
    vec3(0.002, 0.006, 0.028),   // deep: near-black indigo
    depthF
  );

  // Warped UV for wave distortion
  vec2 wuv = uv;
  wuv.x += sin(uv.y *  6.3 + t * 0.85) * 0.016
          + sin(uv.y * 14.0 + t * 1.50) * 0.005;
  wuv.y += cos(uv.x *  4.8 + t * 0.65) * 0.010
          + cos(uv.x * 11.0 + t * 1.10) * 0.004;

  // ── Wave crests with foam sparkles ──────────────────────────────────────
  for (int i = 0; i < 5; i++){
    float fi   = float(i);
    float bY   = 0.1 + fi * 0.18 + sin(t * (0.27 + fi * 0.055) + fi * 1.28) * 0.048;
    float disp = sin(wuv.x * (4.5 + fi * 2.2) + t * (0.38 + fi * 0.042) + fi * 0.87) * 0.042;
    float d    = abs(wuv.y - bY - disp);
    float bright = (0.32 + fi * 0.10) * exp(-d * 44.0);
    float glow   = (0.28 + fi * 0.08) * exp(-d *  7.5);
    col += vec3(0.0, 0.38, 0.65) * bright;
    col += vec3(0.0, 0.04, 0.13) * glow;

    // Foam: sparse bright sparks along the crest line
    float foamCell  = floor(wuv.x * 38.0 + fi * 6.13 + t * (0.45 + fi * 0.07));
    float foamRand  = h21(vec2(foamCell, fi * 4.71 + floor(t * 1.1 + fi)));
    float foamOn    = step(0.74, foamRand);
    float foamFade  = exp(-d * 160.0);
    col += vec3(0.55, 1.00, 0.97) * foamOn * foamFade * 0.55;
  }

  // Ambient FBM undulation
  float n = fbm(wuv * 3.2 + vec2(t * 0.09, -t * 0.06));
  col += vec3(0.0, n * 0.014, n * 0.042);

  // ── Caustic light (deep water interference) ─────────────────────────────
  // Visible in the lower half of the screen (depthF > 0.45)
  float causticMask = smoothstep(0.40, 0.65, depthF);
  if (causticMask > 0.001){
    float cx = sin(uv.x * 10.7 + sin(uv.y * 9.3 + t * 0.55) * 1.8 + t * 0.38);
    float cy = sin(uv.x *  7.4 + uv.y * 12.1 - t * 0.31 + cos(uv.x * 5.8 + t * 0.44) * 1.4);
    float ca = pow(clamp(cx * cy * 0.5 + 0.5, 0.0, 1.0), 2.2);
    col += vec3(0.0, 0.07, 0.18) * ca * causticMask * (1.0 - depthF * 0.7);
  }

  // Deep-floor horizon glow
  col += vec3(0.0, 0.018, 0.09) * pow(depthF, 5.0);

  // ── Sparse ambient glitter ──────────────────────────────────────────────
  vec2 gCell   = floor(uv * vec2(32.0, 18.0));
  vec2 gUV     = fract(uv * vec2(32.0, 18.0)) - 0.5;
  float gSeed  = h21(gCell);
  float gAct   = step(0.86, gSeed);
  float gPhase = gSeed * 6.283 + t * (0.8 + gSeed * 1.4);
  float gPulse = 0.5 + 0.5 * sin(gPhase);
  float gDist  = dot(gUV, gUV);
  // Glitter fades in the deep
  float glitterDepth = 1.0 - depthF * 0.75;
  col += vec3(0.08, 0.84, 0.78) * gAct * gPulse * exp(-gDist * 55.0) * 0.42 * glitterDepth;

  // ── Hex character rain ──────────────────────────────────────────────────
  const float CELL_W = 28.0;
  float cellW  = CELL_W;
  float cellH  = cellW * 1.82;
  float glyphW = cellW * 0.60;
  float glyphH = cellH * 0.70;
  float ROWS   = uR.y / cellH;

  // Pixel coords from top-left
  float px = gl_FragCoord.x;
  float py = uR.y - gl_FragCoord.y;

  // Underwater current: horizontal drift that varies with depth and time
  // Gives columns a sinusoidal sway as if in flowing water
  float currentAmp  = cellW * 0.85;
  float currentDrift = sin(t * 0.38 + py / uR.y * 4.8) * currentAmp
                     + sin(t * 0.21 + py / uR.y * 9.1 + 1.3) * currentAmp * 0.4;
  float px_eff = px + currentDrift;

  float ci     = floor(px_eff / cellW);
  float cxFrac = fract(px_eff / cellW);
  float ryFrac = fract(py / cellH);
  float ri_raw = py / cellH;

  float cSeed  = h11(ci * 0.1373 + 3.71);
  float cSpeed = 3.0 + cSeed * 7.0;
  float cDelay = h11(ci * 0.2931 + 7.23) * ROWS;
  float sLen   = 6.0 + h11(ci * 0.4710 + 1.3) * 9.0;
  float cAlive = step(0.22, h11(ci * 0.6130 + 5.7));

  float headY = mod(t * cSpeed + cDelay, ROWS + 16.0) - 3.0;
  float dHead = ri_raw - headY;
  float fade  = exp(min(0.0, dHead) / sLen) * step(dHead, 0.7) * cAlive;

  if (fade > 0.004){
    int cIdx = clamp(int(h21(vec2(ci * 0.71 + 3.7, floor(ri_raw) * 0.37 + 1.3)) * 16.0), 0, 15);

    float lx = cxFrac * cellW - (cellW - glyphW) * 0.5;
    float ly = ryFrac * cellH - (cellH - glyphH) * 0.5;

    if (lx >= 0.0 && lx < glyphW && ly >= 0.0 && ly < glyphH){
      int gc = clamp(int(lx / glyphW * 5.0), 0, 4);
      int gr = clamp(int(ly / glyphH * 7.0), 0, 6);
      float px_on = charPx(cIdx, gr, gc);

      if (px_on > 0.5){
        float headBoost = exp(dHead * 4.5);
        float hue       = h11(ci * 0.217 + 9.1);

        // Depth-aware trail colour: bright teal at surface, dark blue in the deep
        vec3 shallowCol = mix(vec3(0.07, 0.82, 0.76), vec3(0.10, 0.60, 0.95), hue);
        vec3 deepCol    = mix(vec3(0.01, 0.20, 0.48), vec3(0.02, 0.12, 0.35), hue);
        vec3 trailCol   = mix(shallowCol, deepCol, depthF * 0.80);

        vec3 headCol  = vec3(0.88, 1.00, 0.96);
        vec3 charCol  = mix(trailCol, headCol, headBoost);
        col = mix(col, charCol, fade * (0.58 + fade * 0.32));
      }
    }
  }

  // ── Post-processing ─────────────────────────────────────────────────────
  col *= 1.0 - 0.045 * step(0.5, fract(gl_FragCoord.y * 0.5));

  vec2 vig = uv - 0.5;
  col *= 1.0 - dot(vig, vig) * 1.25;

  col = clamp(col, 0.0, 1.0);
  fragColor = vec4(col, 1.0);
}`;

      // ─── Compile & link ────────────────────────────────────────────────────────────
      function mkShader(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
          console.error("Shader compile:", gl.getShaderInfoLog(s));
        return s;
      }
      const prog = gl.createProgram();
      gl.attachShader(prog, mkShader(gl.VERTEX_SHADER, VS));
      gl.attachShader(prog, mkShader(gl.FRAGMENT_SHADER, FS));
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
        console.error("Link:", gl.getProgramInfoLog(prog));
      gl.useProgram(prog);

      // ─── Fullscreen quad ───────────────────────────────────────────────────────────
      const vao = gl.createVertexArray();
      gl.bindVertexArray(vao);
      const vbuf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, vbuf);
      gl.bufferData(
        gl.ARRAY_BUFFER,
        new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]),
        gl.STATIC_DRAW,
      );
      const aPosLoc = gl.getAttribLocation(prog, "aPos");
      gl.enableVertexAttribArray(aPosLoc);
      gl.vertexAttribPointer(aPosLoc, 2, gl.FLOAT, false, 0, 0);

      const uT = gl.getUniformLocation(prog, "uT");
      const uR = gl.getUniformLocation(prog, "uR");

      // ─── Floating syntax fragments ─────────────────────────────────────────────────
      const TOKENS = [
        "0xFF",
        "0x4A",
        "0xBE",
        "0x00",
        "0x1F",
        "0xDEAD",
        "0xCAFE",
        "0xFF00",
        ">>4",
        ">> 0",
        "<< 2",
        "&&",
        "||",
        "!=",
        "==",
        "null",
        "void",
        "int",
        "return",
        "buf[]",
        "ptr",
        "NaN",
        "EOF",
        "#define",
        "\\0",
        "\\n",
        "\\xFF",
        "fn()",
        "{}",
        "[]",
        ">>",
      ];

      const fragDiv = document.getElementById("frags");
      const N = 22;
      const frs = [];

      for (let i = 0; i < N; i++) {
        const el = document.createElement("div");
        el.className = "frag";
        el.textContent = TOKENS[Math.floor(Math.random() * TOKENS.length)];
        const sz = 10 + Math.random() * 14;
        el.style.fontSize = sz + "px";
        fragDiv.appendChild(el);
        frs.push({
          el,
          x: Math.random() * 100, // vw %
          y: Math.random() * 100, // vh %
          vx: (Math.random() - 0.5) * 0.38,
          vy: (Math.random() - 0.5) * 0.22,
          phase: Math.random() * Math.PI * 2,
          freq: 0.25 + Math.random() * 0.35,
          baseAlpha: 0.3 + Math.random() * 0.38,
          life: Math.random() * 18, // stagger start
          maxLife: 14 + Math.random() * 18,
        });
      }

      function tickFrags(t) {
        const dt = 1 / 60;
        for (const f of frs) {
          f.life += dt;
          if (f.life >= f.maxLife) {
            f.life = 0;
            f.x = Math.random() * 100;
            f.y = Math.random() * 100;
            f.el.textContent =
              TOKENS[Math.floor(Math.random() * TOKENS.length)];
          }
          const lf = f.life / f.maxLife;
          const env = lf < 0.08 ? lf / 0.08 : lf > 0.88 ? (1 - lf) / 0.12 : 1;

          f.x += f.vx;
          f.y += f.vy;
          if (f.x < -12) f.x = 112;
          else if (f.x > 112) f.x = -12;
          if (f.y < -12) f.y = 112;
          else if (f.y > 112) f.y = -12;

          const wx = Math.sin(t * f.freq + f.phase) * 1.6;
          const wy = Math.cos(t * f.freq * 0.8 + f.phase * 1.3) * 1.1;

          f.el.style.left = (f.x + wx).toFixed(2) + "%";
          f.el.style.top = (f.y + wy).toFixed(2) + "%";
          f.el.style.opacity = (f.baseAlpha * env).toFixed(3);
        }
      }

      // ─── Render loop ───────────────────────────────────────────────────────────────
      let t0 = null;
      function frame(ts) {
        if (t0 === null) t0 = ts;
        const t = (ts - t0) * 0.001;

        gl.uniform1f(uT, t);
        gl.uniform2f(uR, canvas.width, canvas.height);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        tickFrags(t);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
