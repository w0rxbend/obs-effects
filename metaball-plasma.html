<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Metaball Plasma</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const canvas = document.getElementById("c");
      const gl = canvas.getContext("webgl2");

      if (!gl) {
        document.body.style.background = "#0d0020";
      } else {
        const VS = `#version 300 es
in vec2 a_pos;
void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }
`;

        const FS = `#version 300 es
precision highp float;
out vec4 o;
uniform vec2 u_res;
uniform float u_t;

// Cosine palette — vaporwave: deep purple → magenta → hot pink → electric blue → cyan
vec3 palette(float t) {
  vec3 a = vec3(0.55, 0.22, 0.72);
  vec3 b = vec3(0.45, 0.38, 0.28);
  vec3 c = vec3(0.88, 0.72, 1.00);
  vec3 d = vec3(0.02, 0.28, 0.58);
  return clamp(a + b * cos(6.28318 * (c * t + d)), 0.0, 1.0);
}

// Metaball contribution: r^2 / (|p-c|^2 + eps)
void blob(vec2 p, vec2 c, float r, float w, inout float field, inout float wfield) {
  vec2 d = p - c;
  float f = (r * r) / (dot(d, d) + 1e-5);
  field  += f;
  wfield += f * w;
}

void main() {
  vec2 uv = gl_FragCoord.xy / u_res;
  float aspect = u_res.x / u_res.y;
  vec2 p = (uv - 0.5) * vec2(aspect * 2.0, 2.0);

  // Slow organic time — full cycle ~28 s at speed 1
  float t = u_t * 0.20;

  float field  = 0.0;
  float wfield = 0.0;

  // 8 blobs: independent sinusoidal orbits, gently breathing radii
  blob(p, vec2(sin(t * 1.10 + 0.00) * 0.78, cos(t * 0.83 + 0.00) * 0.60), 0.30 + sin(t * 1.41) * 0.06, 0.000, field, wfield);
  blob(p, vec2(cos(t * 0.67 + 1.57) * 0.85, sin(t * 1.21 + 2.09) * 0.50), 0.26 + cos(t * 1.07) * 0.05, 0.143, field, wfield);
  blob(p, vec2(sin(t * 1.43 + 3.14) * 0.55, cos(t * 0.91 + 4.19) * 0.72), 0.28 + sin(t * 1.73) * 0.05, 0.286, field, wfield);
  blob(p, vec2(cos(t * 0.79 + 0.52) * 0.90, sin(t * 1.37 + 1.05) * 0.44), 0.22 + cos(t * 0.89) * 0.06, 0.429, field, wfield);
  blob(p, vec2(sin(t * 0.53 + 2.09) * 0.46, cos(t * 1.03 + 3.67) * 0.78), 0.32 + sin(t * 0.67) * 0.07, 0.571, field, wfield);
  blob(p, vec2(cos(t * 1.17 + 4.71) * 0.65, sin(t * 0.71 + 0.84) * 0.54), 0.24 + cos(t * 1.51) * 0.05, 0.714, field, wfield);
  blob(p, vec2(sin(t * 0.89 + 5.76) * 0.70, cos(t * 1.29 + 2.62) * 0.62), 0.27 + sin(t * 1.23) * 0.04, 0.857, field, wfield);
  blob(p, vec2(cos(t * 1.31 + 1.05) * 0.50, sin(t * 0.61 + 5.24) * 0.68), 0.23 + cos(t * 0.97) * 0.06, 1.000, field, wfield);

  // Color: weighted average blob index + plasma ripple + slow drift
  float ct = wfield / max(field, 0.001);
  ct = fract(ct + sin(field * 0.75 + t * 1.1) * 0.13 + t * 0.032);

  vec3 col = palette(ct);

  // Intensity layers
  float aura = smoothstep(0.18, 1.0,   field);
  float body = smoothstep(0.55, 2.2,   field);
  float core = smoothstep(1.80, 5.0,   field);
  float hot  = smoothstep(5.00, 11.0,  field);

  // Composite
  vec3 color = vec3(0.011, 0.004, 0.036);          // deep-space bg
  color += vec3(0.22, 0.04, 0.48) * aura * 0.75;   // violet glow halo
  color  = mix(color, col * 0.88, body);            // blob body
  color  = mix(color, col,        core);            // bright core
  color += vec3(1.00, 0.84, 0.96) * hot;            // white-hot peak

  // Subtle plasma shimmer on body surface
  color += col * (sin(field * 3.8 + t * 1.8) * 0.045) * body;

  // Gamma / tone
  color = pow(clamp(color, 0.0, 1.65), vec3(0.86));

  // Vignette
  color *= smoothstep(0.95, 0.20, length(uv - 0.5));

  o = vec4(color, 1.0);
}
`;

        function mkShader(type, src) {
          const s = gl.createShader(type);
          gl.shaderSource(s, src);
          gl.compileShader(s);
          if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
            console.error("Shader error:", gl.getShaderInfoLog(s));
          return s;
        }

        const prog = gl.createProgram();
        gl.attachShader(prog, mkShader(gl.VERTEX_SHADER, VS));
        gl.attachShader(prog, mkShader(gl.FRAGMENT_SHADER, FS));
        gl.linkProgram(prog);
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
          console.error("Link error:", gl.getProgramInfoLog(prog));
        gl.useProgram(prog);

        // Fullscreen quad — two triangles via TRIANGLE_STRIP
        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(
          gl.ARRAY_BUFFER,
          new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]),
          gl.STATIC_DRAW,
        );
        const loc = gl.getAttribLocation(prog, "a_pos");
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

        const uRes = gl.getUniformLocation(prog, "u_res");
        const uTime = gl.getUniformLocation(prog, "u_t");

        function resize() {
          const dpr = Math.min(devicePixelRatio || 1, 2);
          canvas.width = innerWidth * dpr;
          canvas.height = innerHeight * dpr;
          gl.viewport(0, 0, canvas.width, canvas.height);
        }

        addEventListener("resize", resize);
        resize();

        const t0 = performance.now();
        (function frame() {
          gl.uniform2f(uRes, canvas.width, canvas.height);
          gl.uniform1f(uTime, (performance.now() - t0) / 1000);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          requestAnimationFrame(frame);
        })();
      } // end webgl2 block
    </script>
  </body>
</html>
