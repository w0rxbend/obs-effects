<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cyberpunk Spectrum</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      "use strict";

      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");

      const BARS = 180;
      const LRSP = 0.13;

      let W, H, cx, cy, iR, oR;
      let smooth = new Float32Array(BARS);
      let bassSmooth = 0;

      // OBS WebSocket state
      let obsLevel = 0; // raw max magnitude from InputVolumeMeters (0-1)
      let obsConnected = false;
      let simT = 0; // fallback simulation time

      // Pseudo-spectrum seed noise (static per bar, makes bars feel independent)
      const barNoise = new Float32Array(BARS);
      const barPhase = new Float32Array(BARS);
      const barSpeed = new Float32Array(BARS);
      for (let i = 0; i < BARS; i++) {
        barNoise[i] = Math.random();
        barPhase[i] = Math.random() * Math.PI * 2;
        // Bass bars oscillate slower, highs faster
        const t = i / BARS;
        barSpeed[i] = 0.8 + t * 3.5 + Math.random() * 1.5;
      }

      /* ── resize ───────────────────────────────────────────── */
      function onResize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
        cx = W / 2;
        cy = H / 2;
        const m = Math.min(W, H);
        iR = m * 0.13;
        oR = m * 0.44;
      }
      window.addEventListener("resize", onResize);
      onResize();

      /* ── OBS WebSocket v5 ─────────────────────────────────── */
      async function sha256b64(str) {
        const buf = new TextEncoder().encode(str);
        const hash = await crypto.subtle.digest("SHA-256", buf);
        return btoa(String.fromCharCode(...new Uint8Array(hash)));
      }

      function connectOBS(url = "ws://127.0.0.1:4455", password = "") {
        let ws;
        try {
          ws = new WebSocket(url);
        } catch {
          return;
        }

        ws.onmessage = async (e) => {
          const msg = JSON.parse(e.data);
          const op = msg.op;

          if (op === 0) {
            // Hello — send Identify
            const auth = msg.d.authentication;
            let authStr;
            if (auth && password) {
              const secret = await sha256b64(password + auth.salt);
              authStr = await sha256b64(secret + auth.challenge);
            }
            const identify = {
              op: 1,
              d: {
                rpcVersion: 1,
                // 1 << 16 = InputVolumeMeters (high-volume events)
                eventSubscriptions: 65536,
                ...(authStr ? { authentication: authStr } : {}),
              },
            };
            ws.send(JSON.stringify(identify));
          } else if (op === 2) {
            // Identified — connected successfully
            obsConnected = true;
          } else if (op === 5 && msg.d.eventType === "InputVolumeMeters") {
            // InputVolumeMeters event — take max magnitude across all inputs/channels
            let max = 0;
            for (const input of msg.d.eventData.inputs) {
              const levels = input.inputLevelsMul;
              if (!Array.isArray(levels)) continue;
              for (const ch of levels) {
                const mag = Array.isArray(ch) ? ch[0] : 0;
                if (mag > max) max = mag;
              }
            }
            obsLevel = max;
          }
        };

        ws.onclose = () => {
          obsConnected = false;
          // Retry after 3 s
          setTimeout(() => connectOBS(url, password), 3000);
        };
      }

      connectOBS();

      /* ── pseudo-spectrum generation ───────────────────────── */
      // OBS only gives overall level — we distribute it into a plausible
      // spectrum shape: bass-heavy envelope with high-freq transient variation.
      let now = 0;
      function updateSpectrum(dt) {
        now += dt;

        // Choose driving level: OBS when connected, idle simulation otherwise
        let envLevel;
        if (obsConnected) {
          // perceptual sqrt + small noise floor so the ring never goes dead
          envLevel = Math.sqrt(Math.min(1, obsLevel)) * 0.95 + 0.05;
        } else {
          simT += dt;
          const t = simT;
          envLevel =
            0.12 +
            Math.abs(Math.sin(t * 0.29)) * 0.15 +
            Math.abs(Math.sin(t * 0.73)) * 0.08;
        }

        for (let i = 0; i < BARS; i++) {
          const t = i / BARS; // 0 = bass, 1 = treble
          // Bass frequencies carry more amplitude
          const freqEnv = Math.pow(1 - t * 0.7, 1.4);
          // Per-bar oscillation — faster at higher frequencies
          barPhase[i] += barSpeed[i] * dt;
          const osc = 0.5 + 0.5 * Math.sin(barPhase[i]);
          // Noise texture variation
          const noiseVar =
            0.7 + 0.3 * Math.sin(barPhase[i] * 0.37 + barNoise[i] * 6.28);
          const target = envLevel * freqEnv * osc * noiseVar;
          smooth[i] += (target - smooth[i]) * LRSP;
        }
      }

      /* ── colour ───────────────────────────────────────────── */
      function hueAt(t) {
        return t < 0.5 ? 275 - t * 2 * 90 : 185 + (t - 0.5) * 2 * 90;
      }

      function barColor(t, L) {
        return `hsl(${hueAt(t) | 0},100%,${L | 0}%)`;
      }

      /* ── draw ─────────────────────────────────────────────── */
      let last = performance.now();

      function draw(ts) {
        requestAnimationFrame(draw);
        const dt = Math.min((ts - last) * 0.001, 0.05);
        last = ts;

        updateSpectrum(dt);

        ctx.clearRect(0, 0, W, H);

        let avg = 0;
        for (let i = 0; i < BARS; i++) avg += smooth[i];
        avg /= BARS;

        // Bass: first 8 bars average
        let bass = 0;
        for (let i = 0; i < 8; i++) bass += smooth[i];
        bass /= 8;
        bassSmooth += (bass - bassSmooth) * 0.18;

        /* ── bars — two-pass: glow then sharp core */
        for (let pass = 0; pass < 2; pass++) {
          ctx.save();
          if (pass === 0) {
            ctx.globalAlpha = 0.32;
            ctx.shadowBlur = 30;
          } else {
            ctx.globalAlpha = 1.0;
            ctx.shadowBlur = 7;
          }

          for (let i = 0; i < BARS; i++) {
            const t = i / BARS;
            const angle = t * Math.PI * 2 - Math.PI / 2;
            const amp = smooth[i];
            const barH = amp * (oR - iR);

            const L = pass === 0 ? 62 : 68 + amp * 22;
            const color = barColor(t, L);

            ctx.shadowColor = color;
            ctx.strokeStyle = color;
            ctx.lineWidth = pass === 0 ? 4 : 1.8;
            ctx.lineCap = "round";

            const cosA = Math.cos(angle);
            const sinA = Math.sin(angle);

            ctx.beginPath();
            ctx.moveTo(cx + cosA * iR, cy + sinA * iR);
            ctx.lineTo(cx + cosA * (iR + barH), cy + sinA * (iR + barH));
            ctx.stroke();
          }

          ctx.restore();
        }

        /* ── bar-tip dots when amplitude is high */
        ctx.save();
        ctx.shadowBlur = 10;
        for (let i = 0; i < BARS; i++) {
          const amp = smooth[i];
          if (amp < 0.35) continue;
          const t = i / BARS;
          const angle = t * Math.PI * 2 - Math.PI / 2;
          const tipR = iR + amp * (oR - iR);
          const color = barColor(t, 82);
          ctx.shadowColor = color;
          ctx.fillStyle = color;
          ctx.globalAlpha = (amp - 0.35) * 1.5;
          ctx.beginPath();
          ctx.arc(
            cx + Math.cos(angle) * tipR,
            cy + Math.sin(angle) * tipR,
            1.5,
            0,
            Math.PI * 2,
          );
          ctx.fill();
        }
        ctx.restore();

        /* ── base ring */
        const ringR = iR * (0.93 + avg * 0.1);
        ctx.save();
        ctx.shadowBlur = 28;
        ctx.shadowColor = "rgba(0,229,255,.9)";
        ctx.strokeStyle = `rgba(0,229,255,${0.28 + avg * 0.5})`;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.arc(cx, cy, ringR, 0, Math.PI * 2);
        ctx.stroke();

        ctx.shadowBlur = 4;
        ctx.shadowColor = "rgba(200,245,255,.8)";
        ctx.strokeStyle = `rgba(200,245,255,${0.55 + avg * 0.4})`;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.arc(cx, cy, ringR, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        /* ── centre dot, pulses with bass */
        ctx.save();
        const dotR = 2.5 + bassSmooth * 9;
        const dotHue = 235 + bassSmooth * 40;
        ctx.shadowBlur = 22 + bassSmooth * 12;
        ctx.shadowColor = `hsl(${dotHue},100%,65%)`;
        ctx.fillStyle = `hsl(${dotHue},100%,82%)`;
        ctx.globalAlpha = 0.82 + bassSmooth * 0.18;
        ctx.beginPath();
        ctx.arc(cx, cy, dotR, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        /* ── subtle outer boundary ring */
        ctx.save();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = `rgba(160,0,255,${0.08 + avg * 0.07})`;
        ctx.lineWidth = 0.6;
        ctx.beginPath();
        ctx.arc(cx, cy, oR, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      requestAnimationFrame(draw);
    </script>
  </body>
</html>
