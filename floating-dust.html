<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Floating Dust — worxbend</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #060410;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js"></script>
    <script>
      /* global PIXI */
      (function () {
        "use strict";

        // ── Perlin noise ──────────────────────────────────────────────────────
        const PERM = new Uint8Array(512);
        (function () {
          const p = new Uint8Array(256);
          for (let i = 0; i < 256; i++) p[i] = i;
          for (let i = 255; i > 0; i--) {
            const j = (Math.random() * (i + 1)) | 0;
            const t = p[i];
            p[i] = p[j];
            p[j] = t;
          }
          for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
        })();

        function fade(t) {
          return t * t * t * (t * (t * 6 - 15) + 10);
        }
        function grad2(h, x, y) {
          switch (h & 3) {
            case 0:
              return x + y;
            case 1:
              return -x + y;
            case 2:
              return x - y;
            default:
              return -x - y;
          }
        }

        function perlin2(x, y) {
          const xi = Math.floor(x) & 255,
            yi = Math.floor(y) & 255;
          const xf = x - Math.floor(x),
            yf = y - Math.floor(y);
          const u = fade(xf),
            v = fade(yf);
          const aa = PERM[PERM[xi] + yi];
          const ab = PERM[PERM[xi] + yi + 1];
          const ba = PERM[PERM[xi + 1] + yi];
          const bb = PERM[PERM[xi + 1] + yi + 1];
          const lp = (a, b, t) => a + (b - a) * t;
          return lp(
            lp(grad2(aa, xf, yf), grad2(ba, xf - 1, yf), u),
            lp(grad2(ab, xf, yf - 1), grad2(bb, xf - 1, yf - 1), u),
            v,
          );
        }

        function flowAngle(x, y, t) {
          const s = 0.0016;
          const ts = t * 0.035;
          const n1 = perlin2(x * s + ts, y * s);
          const n2 = perlin2(x * s * 2.1 + ts + 7.3, y * s * 2.1 + 3.1) * 0.5;
          return (n1 + n2) * Math.PI * 2.5;
        }

        // ── App ───────────────────────────────────────────────────────────────
        const app = new PIXI.Application({
          width: window.innerWidth,
          height: window.innerHeight,
          backgroundColor: 0x060410,
          resolution: Math.min(window.devicePixelRatio || 1, 2),
          autoDensity: true,
          antialias: false,
        });
        document.body.appendChild(app.view);

        // ── Textures ──────────────────────────────────────────────────────────
        function makeSoftDot(radius, stops) {
          const d = radius * 2 + 2;
          const cnv = document.createElement("canvas");
          cnv.width = cnv.height = d;
          const ctx = cnv.getContext("2d");
          const rg = ctx.createRadialGradient(
            d / 2,
            d / 2,
            0,
            d / 2,
            d / 2,
            radius,
          );
          for (const [pos, a] of stops)
            rg.addColorStop(pos, `rgba(255,255,255,${a})`);
          ctx.fillStyle = rg;
          ctx.fillRect(0, 0, d, d);
          return PIXI.Texture.from(cnv);
        }

        const TEX_TINY = makeSoftDot(4, [
          [0, 1.0],
          [0.4, 0.85],
          [0.8, 0.18],
          [1, 0],
        ]);
        const TEX_MED = makeSoftDot(8, [
          [0, 1.0],
          [0.35, 0.9],
          [0.7, 0.28],
          [1, 0],
        ]);
        const TEX_GLOW = makeSoftDot(16, [
          [0, 1.0],
          [0.25, 0.95],
          [0.6, 0.38],
          [1, 0],
        ]);
        const TEX_FOG = makeSoftDot(180, [
          [0, 0.14],
          [0.45, 0.06],
          [1, 0],
        ]);

        // ── Scene containers ──────────────────────────────────────────────────
        const bgGfx = new PIXI.Graphics();
        const fogCnt = new PIXI.Container();
        const pcFar = new PIXI.ParticleContainer(2000, {
          scale: true,
          position: true,
          tint: true,
          alpha: true,
        });
        const pcMid = new PIXI.ParticleContainer(1500, {
          scale: true,
          position: true,
          tint: true,
          alpha: true,
        });
        const pcNear = new PIXI.ParticleContainer(400, {
          scale: true,
          position: true,
          tint: true,
          alpha: true,
        });
        pcNear.blendMode = PIXI.BLEND_MODES.ADD;

        app.stage.addChild(bgGfx, fogCnt, pcFar, pcMid, pcNear);

        // ── Post-processing filter ────────────────────────────────────────────
        const POST_FRAG = `
        varying vec2 vTextureCoord;
        uniform sampler2D uSampler;
        uniform float uTime;

        float grain(vec2 uv, float t) {
          return fract(sin(dot(uv + fract(t * 0.017), vec2(127.1, 311.7))) * 43758.5453) - 0.5;
        }

        void main() {
          vec2 uv  = vTextureCoord;
          vec4 col = texture2D(uSampler, uv);

          // Vignette
          vec2 v = (uv - 0.5) * 1.9;
          col.rgb *= clamp(1.0 - dot(v, v) * 0.54, 0.0, 1.0);

          // Warm center haze
          float d = length(uv - 0.5);
          col.rgb += vec3(0.09, 0.045, 0.012) * max(0.0, 1.0 - d * 2.7);

          // Atmospheric fog lift at bottom
          float fog = smoothstep(0.55, 1.0, uv.y) * 0.06;
          col.rgb += vec3(0.06, 0.03, 0.01) * fog;

          // Film grain
          col.rgb += grain(uv, uTime) * 0.036;

          gl_FragColor = vec4(clamp(col.rgb, 0.0, 1.0), col.a);
        }
      `;

        const postFilter = new PIXI.Filter(null, POST_FRAG, { uTime: 0 });
        app.stage.filters = [postFilter];

        // ── Helpers ───────────────────────────────────────────────────────────
        function rnd(lo, hi) {
          return lo + Math.random() * (hi - lo);
        }
        function pick(arr) {
          return arr[(Math.random() * arr.length) | 0];
        }

        // ── Color palettes ────────────────────────────────────────────────────
        const FAR_COLORS = [0x4a3a7a, 0x332866, 0x3a2f5a, 0x5a4a8a, 0x2a2050];
        const MID_COLORS = [
          0xd4b89a, 0xc88850, 0x9a78bb, 0xd0a87a, 0xe4c8a8, 0xb87a40,
        ];
        const NEAR_COLORS = [
          0xf0a840, 0xffd080, 0xdd88ff, 0xffe0c0, 0xffbb66, 0xeec0ff,
        ];

        // ── Fog descriptors ───────────────────────────────────────────────────
        const FOG_DEFS = [
          {
            fx: 0.25,
            fy: 0.4,
            tint: 0xa060a0,
            sc: 2.2,
            a: 0.18,
            spd: 8,
            ph: 0.0,
          },
          {
            fx: 0.72,
            fy: 0.55,
            tint: 0x806040,
            sc: 2.8,
            a: 0.14,
            spd: 10,
            ph: 2.1,
          },
          {
            fx: 0.5,
            fy: 0.22,
            tint: 0x604090,
            sc: 1.8,
            a: 0.11,
            spd: 6,
            ph: 4.4,
          },
          {
            fx: 0.15,
            fy: 0.68,
            tint: 0x805030,
            sc: 2.1,
            a: 0.1,
            spd: 7,
            ph: 1.3,
          },
          {
            fx: 0.85,
            fy: 0.3,
            tint: 0x705090,
            sc: 1.6,
            a: 0.09,
            spd: 5,
            ph: 3.7,
          },
        ];

        // ── State ─────────────────────────────────────────────────────────────
        let fogSprites = [];
        let farParts = [];
        let midParts = [];
        let nearParts = [];

        function makeParticleLayer(
          cont,
          tex,
          count,
          colors,
          spdLo,
          spdHi,
          scLo,
          scHi,
          aLo,
          aHi,
        ) {
          const W = app.screen.width,
            H = app.screen.height;
          const arr = [];
          for (let i = 0; i < count; i++) {
            const sp = new PIXI.Sprite(tex);
            sp.anchor.set(0.5);
            const x = rnd(0, W),
              y = rnd(0, H);
            const sc = rnd(scLo, scHi);
            const ba = rnd(aLo, aHi);
            sp.position.set(x, y);
            sp.scale.set(sc);
            sp.alpha = ba;
            sp.tint = pick(colors);
            cont.addChild(sp);
            arr.push({
              sp,
              x,
              y,
              spd: rnd(spdLo, spdHi),
              ba,
              ph: rnd(0, 6.283),
              br: rnd(0.22, 0.65),
            });
          }
          return arr;
        }

        function initAll() {
          const W = app.screen.width,
            H = app.screen.height;

          bgGfx.clear();
          bgGfx.beginFill(0x060410);
          bgGfx.drawRect(0, 0, W, H);
          bgGfx.endFill();

          // Fog blobs
          fogCnt.removeChildren();
          fogSprites = FOG_DEFS.map((def) => {
            const sp = new PIXI.Sprite(TEX_FOG);
            sp.anchor.set(0.5);
            sp.x = def.fx * W;
            sp.y = def.fy * H;
            sp.scale.set(def.sc);
            sp.alpha = def.a;
            sp.tint = def.tint;
            fogCnt.addChild(sp);
            return { sp, ox: sp.x, oy: sp.y, spd: def.spd, ph: def.ph };
          });

          pcFar.removeChildren();
          pcMid.removeChildren();
          pcNear.removeChildren();

          //                  count  colors       spdLo spdHi  scLo scHi   aLo  aHi
          farParts = makeParticleLayer(
            pcFar,
            TEX_TINY,
            2000,
            FAR_COLORS,
            8,
            20,
            0.12,
            0.45,
            0.04,
            0.22,
          );
          midParts = makeParticleLayer(
            pcMid,
            TEX_MED,
            1500,
            MID_COLORS,
            15,
            40,
            0.1,
            0.48,
            0.14,
            0.52,
          );
          nearParts = makeParticleLayer(
            pcNear,
            TEX_GLOW,
            400,
            NEAR_COLORS,
            22,
            65,
            0.1,
            0.55,
            0.28,
            0.74,
          );
        }

        initAll();

        window.addEventListener("resize", () => {
          app.renderer.resize(window.innerWidth, window.innerHeight);
          initAll();
        });

        // ── Tick ──────────────────────────────────────────────────────────────
        app.ticker.maxFPS = 60;
        let elapsed = 0;

        app.ticker.add((delta) => {
          const dt = Math.min(delta / 60, 0.05);
          elapsed += dt;
          const t = elapsed;
          const W = app.screen.width,
            H = app.screen.height;

          postFilter.uniforms.uTime = t;

          // Fog — slow sinusoidal drift
          for (let i = 0; i < fogSprites.length; i++) {
            const f = fogSprites[i];
            f.sp.x = f.ox + Math.cos(t * 0.055 + f.ph) * f.spd * 9;
            f.sp.y = f.oy + Math.sin(t * 0.038 + f.ph * 0.7) * f.spd * 6;
          }

          // Particle step (inline for minimal overhead)
          function step(parts, margin) {
            const n = parts.length;
            for (let i = 0; i < n; i++) {
              const p = parts[i];
              const ang = flowAngle(p.x, p.y, t);
              p.x += Math.cos(ang) * p.spd * dt;
              p.y += Math.sin(ang) * p.spd * dt;
              if (p.x < -margin) p.x = W + margin;
              else if (p.x > W + margin) p.x = -margin;
              if (p.y < -margin) p.y = H + margin;
              else if (p.y > H + margin) p.y = -margin;
              p.sp.x = p.x;
              p.sp.y = p.y;
              p.sp.alpha = p.ba * (0.82 + 0.18 * Math.sin(t * p.br + p.ph));
            }
          }

          step(farParts, 22);
          step(midParts, 22);
          step(nearParts, 22);
        });
      })();
    </script>
  </body>
</html>
