<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ink Dissolve – Razer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0c0a;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <script>
      (function () {
        var canvas = document.getElementById("canvas");
        var prefersReduced = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;

        var gl = canvas.getContext("webgl", {
          alpha: false,
          antialias: false,
          preserveDrawingBuffer: false,
        });
        if (!gl) return;

        var SPREAD_SPEED = 0.4;
        var TENDRIL_DETAIL = 1.0;

        // ── OBS WebSocket audio ──────────────────────────────────────────────
        var obsLevel = 0; // raw linear magnitude (0-1)
        var audioLevel = 0; // smoothed overall level
        var audioBass = 0; // slow-following bass envelope
        var audioHigh = 0; // fast-following transient envelope
        var audioBeatCd = 0; // beat cooldown (seconds)
        var audioBeat = false;
        var audioSimT = 0; // fallback simulation clock
        var obsConnected = false;

        function connectOBS(url, password) {
          url = url || "ws://127.0.0.1:4455";
          password = password || "";
          var ws;
          try {
            ws = new WebSocket(url);
          } catch (e) {
            return;
          }

          ws.onmessage = function (e) {
            var msg = JSON.parse(e.data);
            if (msg.op === 0) {
              // Hello — send Identify with high-volume event subscription
              var auth = msg.d.authentication;
              var identify = function (authStr) {
                var d = { rpcVersion: 1, eventSubscriptions: 65536 };
                if (authStr) d.authentication = authStr;
                ws.send(JSON.stringify({ op: 1, d: d }));
              };
              if (auth && password) {
                var enc = new TextEncoder();
                var digest = function (str) {
                  return crypto.subtle.digest("SHA-256", enc.encode(str));
                };
                digest(password + auth.salt)
                  .then(function (h1) {
                    var s = btoa(
                      String.fromCharCode.apply(null, new Uint8Array(h1)),
                    );
                    return digest(s + auth.challenge);
                  })
                  .then(function (h2) {
                    identify(
                      btoa(String.fromCharCode.apply(null, new Uint8Array(h2))),
                    );
                  });
              } else {
                identify(null);
              }
            } else if (msg.op === 2) {
              obsConnected = true;
            } else if (
              msg.op === 5 &&
              msg.d.eventType === "InputVolumeMeters"
            ) {
              var max = 0;
              var inputs = msg.d.eventData.inputs;
              for (var i = 0; i < inputs.length; i++) {
                var levels = inputs[i].inputLevelsMul;
                if (!Array.isArray(levels)) continue;
                for (var c = 0; c < levels.length; c++) {
                  var mag = Array.isArray(levels[c]) ? levels[c][0] : 0;
                  if (mag > max) max = mag;
                }
              }
              obsLevel = max;
            }
          };
          ws.onclose = function () {
            obsConnected = false;
            setTimeout(function () {
              connectOBS(url, password);
            }, 3000);
          };
        }

        connectOBS();

        // Advance audio state — called each frame with dt in seconds
        function updateAudio(dt) {
          audioBeat = false;
          audioBeatCd = Math.max(0, audioBeatCd - dt);

          var raw;
          if (!obsConnected) {
            audioSimT += dt;
            var t = audioSimT;
            raw =
              0.08 +
              Math.abs(Math.sin(t * 0.29)) * 0.12 +
              Math.abs(Math.sin(t * 1.1)) * 0.06;
          } else {
            raw = Math.sqrt(Math.min(1, obsLevel));
          }

          // Bass: slow following
          audioBass +=
            (raw - audioBass) * Math.min(1, dt * (raw > audioBass ? 7 : 2.5));
          // High: fast transient
          audioHigh +=
            (raw - audioHigh) * Math.min(1, dt * (raw > audioHigh ? 28 : 6));
          // Level: balanced
          audioLevel += (raw - audioLevel) * Math.min(1, dt * 10);

          if (audioBass > 0.22 && audioBeatCd <= 0) {
            audioBeat = true;
            audioBeatCd = 0.25;
          }
        }

        var vertSrc = [
          "attribute vec2 a_pos;",
          "void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }",
        ].join("\n");

        var fragSrc = [
          "precision highp float;",
          "",
          "uniform float u_time;",
          "uniform vec2 u_res;",
          "uniform float u_spread;",
          "uniform float u_detail;",
          "uniform vec2 u_mouse;",
          "",
          "vec3 mod289(vec3 x) { return x - floor(x * (1.0/289.0)) * 289.0; }",
          "vec2 mod289v2(vec2 x) { return x - floor(x * (1.0/289.0)) * 289.0; }",
          "vec3 permute(vec3 x) { return mod289(((x * 34.0) + 1.0) * x); }",
          "",
          "float snoise(vec2 v) {",
          "  const vec4 C = vec4(0.211324865405187, 0.366025403784439,",
          "                     -0.577350269189626, 0.024390243902439);",
          "  vec2 i = floor(v + dot(v, C.yy));",
          "  vec2 x0 = v - i + dot(i, C.xx);",
          "  vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);",
          "  vec4 x12 = x0.xyxy + C.xxzz;",
          "  x12.xy -= i1;",
          "  i = mod289v2(i);",
          "  vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));",
          "  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);",
          "  m = m*m; m = m*m;",
          "  vec3 x = 2.0 * fract(p * C.www) - 1.0;",
          "  vec3 h = abs(x) - 0.5;",
          "  vec3 ox = floor(x + 0.5);",
          "  vec3 a0 = x - ox;",
          "  m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);",
          "  vec3 g;",
          "  g.x = a0.x * x0.x + h.x * x0.y;",
          "  g.yz = a0.yz * x12.xz + h.yz * x12.yw;",
          "  return 130.0 * dot(m, g);",
          "}",
          "",
          "float fbm4(vec2 p, float dm) {",
          "  float v = 0.0; float a = 0.55;",
          "  mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);",
          "  v += a * snoise(p); a *= 0.45; p = rot * p * 2.02;",
          "  v += a * snoise(p); a *= 0.45; p = rot * p * 2.03;",
          "  v += a * snoise(p) * dm; a *= 0.4; p = rot * p * 2.01;",
          "  v += a * snoise(p) * dm * 0.6;",
          "  return v;",
          "}",
          "",
          "float fbm3(vec2 p) {",
          "  float v = 0.0;",
          "  mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);",
          "  v += 0.5 * snoise(p); p = rot * p * 2.02;",
          "  v += 0.25 * snoise(p); p = rot * p * 2.03;",
          "  v += 0.125 * snoise(p);",
          "  return v;",
          "}",
          "",
          "float inkField(vec2 p, float t, float dm) {",
          "  vec2 q = vec2(",
          "    fbm4(p + vec2(0.0, 0.0) + t * 0.04, dm),",
          "    fbm4(p + vec2(5.2, 1.3) + t * 0.03, dm)",
          "  );",
          "  vec2 r = vec2(",
          "    fbm4(p + 2.5 * q + vec2(1.7, 9.2) + t * 0.022, dm),",
          "    fbm4(p + 2.5 * q + vec2(8.3, 2.8) + t * 0.032, dm)",
          "  );",
          "  return fbm4(p + 2.2 * r + t * 0.015, dm);",
          "}",
          "",
          "void main() {",
          "  vec2 uv = (gl_FragCoord.xy - u_res * 0.5) / min(u_res.x, u_res.y);",
          "  float t = u_time * u_spread;",
          "  float dm = u_detail;",
          "",
          "  float field = inkField(uv * 0.8, t, dm);",
          "",
          "  float envelope = 0.0;",
          "  float a1 = t * 0.05;",
          "  envelope += smoothstep(0.95, 0.0, length(uv - vec2(cos(a1)*0.15, sin(a1*0.7)*0.12)));",
          "  float a2 = t * 0.04 + 2.2;",
          "  envelope += smoothstep(0.85, 0.0, length(uv - vec2(cos(a2)*0.25, sin(a2*0.6)*0.2)));",
          "  float a3 = t * 0.048 + 4.7;",
          "  envelope += smoothstep(0.75, 0.0, length(uv - vec2(cos(a3*0.8)*0.2, sin(a3)*0.16)));",
          "  envelope += smoothstep(0.65, 0.0, length(uv)) * 0.6;",
          "",
          "  if (u_mouse.x >= 0.0) {",
          "    vec2 mPos = (u_mouse - u_res * 0.5) / min(u_res.x, u_res.y);",
          "    envelope += smoothstep(0.6, 0.0, length(uv - mPos)) * 0.8;",
          "  }",
          "  envelope = clamp(envelope, 0.0, 1.0);",
          "",
          "  float inkRaw = smoothstep(-0.2, 0.1, field);",
          "  float ink = inkRaw * envelope;",
          "",
          "  float fineField = fbm3(uv * 2.5 + vec2(t * 0.02, -t * 0.015));",
          "  float fineTendril = smoothstep(-0.1, 0.12, fineField) * envelope;",
          "  float combinedInk = max(ink, fineTendril * 0.35);",
          "",
          "  float edgeRaw = combinedInk * (1.0 - combinedInk) * 4.0;",
          "  float edgeSoft = smoothstep(0.05, 0.5, edgeRaw);",
          "  float edgeMid = smoothstep(0.25, 0.8, edgeRaw);",
          "  float edgeHot = smoothstep(0.6, 1.0, edgeRaw);",
          "",
          "  float fineEdge = fineTendril * (1.0 - fineTendril) * 4.0;",
          "  fineEdge = smoothstep(0.3, 0.9, fineEdge) * 0.4;",
          "",
          "  // ── Color palette (Razer green & gun metal) ──",
          "  vec3 inkDark    = vec3(0.015, 0.020, 0.015);",
          "  vec3 amberDim   = vec3(0.040, 0.055, 0.040);",
          "  vec3 amberDeep  = vec3(0.080, 0.100, 0.080);",
          "  vec3 amberWarm  = vec3(0.120, 0.400, 0.070);",
          "  vec3 amberGold  = vec3(0.267, 0.839, 0.173);",
          "  vec3 amberBright= vec3(0.550, 0.970, 0.450);",
          "  vec3 amberHot   = vec3(0.800, 1.000, 0.720);",
          "",
          "  float liqVar = 0.5 + 0.5 * fbm3(uv * 2.0 + t * 0.03);",
          "  vec3 liquid = mix(amberDim, amberDeep, liqVar * 0.7);",
          "",
          "  float c1 = 0.5 + 0.5 * snoise(uv * 6.0 + vec2(t * 0.05, -t * 0.035));",
          "  float c2 = 0.5 + 0.5 * snoise(uv * 10.0 + vec2(-t * 0.03, t * 0.04));",
          "  liquid += amberWarm * c1 * c2 * 0.05 * (1.0 - combinedInk);",
          "",
          "  vec3 col = mix(liquid, inkDark, combinedInk);",
          "",
          "  col += amberDeep  * edgeSoft * 0.7;",
          "  col += amberGold  * edgeMid  * 0.4;",
          "  col += amberBright* edgeHot  * 0.45;",
          "  col += amberHot   * edgeHot  * edgeHot * 0.25;",
          "",
          "  col += amberWarm * fineEdge * 0.3;",
          "  col += amberGold * fineEdge * fineEdge * 0.15;",
          "",
          "  float inkTex = 0.5 + 0.5 * snoise(uv * 3.5 + t * 0.01);",
          "  col += vec3(0.010, 0.018, 0.010) * inkTex * combinedInk;",
          "",
          "  float thinInk = smoothstep(0.5, 0.1, combinedInk);",
          "  col += amberDim * thinInk * edgeSoft * 0.3;",
          "",
          "  float vertGlow = smoothstep(0.6, -0.3, uv.y);",
          "  col += vec3(0.010, 0.025, 0.008) * vertGlow * (1.0 - combinedInk * 0.6);",
          "",
          "  float vig = 1.0 - smoothstep(0.35, 1.2, length(uv));",
          "  col *= 0.5 + 0.5 * vig;",
          "",
          "  col = pow(max(col, 0.0), vec3(1.00, 0.92, 1.04));",
          "",
          "  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);",
          "}",
        ].join("\n");

        function compile(type, src) {
          var s = gl.createShader(type);
          gl.shaderSource(s, src);
          gl.compileShader(s);
          if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
            console.error("Shader compile error:", gl.getShaderInfoLog(s));
          return s;
        }

        var prog = gl.createProgram();
        gl.attachShader(prog, compile(gl.VERTEX_SHADER, vertSrc));
        gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fragSrc));
        gl.linkProgram(prog);
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
          console.error("Program link error:", gl.getProgramInfoLog(prog));
        gl.useProgram(prog);

        var buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(
          gl.ARRAY_BUFFER,
          new Float32Array([-1, -1, 3, -1, -1, 3]),
          gl.STATIC_DRAW,
        );
        var aPos = gl.getAttribLocation(prog, "a_pos");
        gl.enableVertexAttribArray(aPos);
        gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

        var uTime = gl.getUniformLocation(prog, "u_time");
        var uRes = gl.getUniformLocation(prog, "u_res");
        var uSpread = gl.getUniformLocation(prog, "u_spread");
        var uDetail = gl.getUniformLocation(prog, "u_detail");
        var uMouse = gl.getUniformLocation(prog, "u_mouse");

        var mouseX = -1,
          mouseY = -1,
          smoothMouseX = -1,
          smoothMouseY = -1,
          mouseActive = false;

        canvas.addEventListener("mousemove", function (e) {
          mouseX = e.clientX * Math.min(window.devicePixelRatio || 1, 2);
          mouseY =
            (canvas.clientHeight - e.clientY) *
            Math.min(window.devicePixelRatio || 1, 2);
          mouseActive = true;
        });
        canvas.addEventListener("mouseleave", function () {
          mouseActive = false;
        });
        canvas.addEventListener(
          "touchstart",
          function (e) {
            var t = e.touches[0];
            mouseX = t.clientX * Math.min(window.devicePixelRatio || 1, 2);
            mouseY =
              (canvas.clientHeight - t.clientY) *
              Math.min(window.devicePixelRatio || 1, 2);
            mouseActive = true;
          },
          { passive: true },
        );
        canvas.addEventListener(
          "touchmove",
          function (e) {
            e.preventDefault();
            var t = e.touches[0];
            mouseX = t.clientX * Math.min(window.devicePixelRatio || 1, 2);
            mouseY =
              (canvas.clientHeight - t.clientY) *
              Math.min(window.devicePixelRatio || 1, 2);
            mouseActive = true;
          },
          { passive: false },
        );
        canvas.addEventListener("touchend", function () {
          mouseActive = false;
        });

        var dpr = Math.min(window.devicePixelRatio || 1, 2),
          needsResize = true;

        function resize() {
          needsResize = false;
          var w = Math.round(canvas.clientWidth * dpr),
            h = Math.round(canvas.clientHeight * dpr);
          if (canvas.width !== w || canvas.height !== h) {
            canvas.width = w;
            canvas.height = h;
            gl.viewport(0, 0, w, h);
            gl.uniform2f(uRes, w, h);
          }
        }

        var lastTime = 0,
          paused = false;
        // Beat flash — spreads ink burst on audio transient
        var beatFlash = 0;

        function render(now) {
          if (paused) {
            requestAnimationFrame(render);
            return;
          }
          if (lastTime === 0) lastTime = now;
          var dt = Math.min((now - lastTime) * 0.001, 0.05);
          lastTime = now;
          if (needsResize) resize();
          if (mouseActive) {
            if (smoothMouseX < 0) {
              smoothMouseX = mouseX;
              smoothMouseY = mouseY;
            }
            smoothMouseX += (mouseX - smoothMouseX) * 0.08;
            smoothMouseY += (mouseY - smoothMouseY) * 0.08;
          } else {
            smoothMouseX = -1;
            smoothMouseY = -1;
          }

          if (!prefersReduced) updateAudio(dt);

          // Audio drives spread speed and tendril detail
          var audioSpread =
            SPREAD_SPEED * (1.0 + audioLevel * 1.8 + audioBass * 0.8);
          var audioDetail = TENDRIL_DETAIL * (1.0 + audioHigh * 0.6);

          // Beat flash briefly spikes spread
          if (audioBeat) beatFlash = 1.0;
          beatFlash *= 0.85;
          audioSpread += beatFlash * SPREAD_SPEED * 2.0;

          gl.uniform1f(uTime, prefersReduced ? 0.0 : now * 0.001);
          gl.uniform1f(uSpread, audioSpread);
          gl.uniform1f(uDetail, audioDetail);
          gl.uniform2f(uMouse, smoothMouseX, smoothMouseY);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
          requestAnimationFrame(render);
        }

        window.addEventListener("resize", function () {
          needsResize = true;
        });
        resize();
        requestAnimationFrame(render);
        document.addEventListener("visibilitychange", function () {
          paused = document.hidden;
          if (!paused) lastTime = 0;
        });
        window.addEventListener("message", function (e) {
          if (e.data && e.data.type === "param") {
            if (e.data.name === "SPREAD_SPEED") SPREAD_SPEED = e.data.value;
            if (e.data.name === "TENDRIL_DETAIL") TENDRIL_DETAIL = e.data.value;
          }
        });
      })();
    </script>
